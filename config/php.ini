; Project-specific PHP configuration
; Used via: php -S <host> -c ./config/php.ini router.php

[PHP]
error_reporting = E_ALL
display_errors = off
log_errors = On

extension_dir = "${PHP_EXT_DIR}"

extension=curl
extension=fileinfo
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=zip

[File uploads]
file_uploads = On
upload_max_filesize = 32M
post_max_size = 33M
max_file_uploads = 20
